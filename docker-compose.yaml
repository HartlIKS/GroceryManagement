services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pass
      POSTGRES_DB: postgres
    secrets:
      - source: postgres_pw
        target: pg_pass
    ports:
      - "5432:5432"
    volumes:
      - type: volume
        source: pg-data
        target: /var/lib/postgresql
  rauthy:
    image: ghcr.io/sebadob/rauthy
    environment:
      LOCAL_TEST: true
      DISABLE_REFRESH_TOKEN_NBF: true
      TLS_GENERATE_SELF_SIGNED: false
      LISTEN_SCHEME: http
      LISTEN_PORT_HTTP: 8081
      PUB_URL: localhost:8081
      RP_ORIGIN: http://localhost:8081
    volumes:
      - type: volume
        source: rauthy-data
        target: /app/data
    ports:
      - "8081:8081"
  grocery-manager:
    image: ghcr.io/hartliks/grocerymanagement:quarkus
    pull_policy: never # only use locally built images
    depends_on:
      - postgres
      - rauthy
    environment:
      SMALLRYE_CONFIG_SOURCE_FILE_LOCATIONS: /run/secrets
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/postgres
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_OIDC_AUTH_SERVER_URL: "http://rauthy:8081/auth/v1/"
      QUARKUS_OIDC_TOKEN_ISSUER: "http://localhost:8081/auth/v1/"
      QUARKUS_OIDC_DISCOVERY_ENABLED: false
      QUARKUS_OIDC_JWKS_PATH: "oidc/certs"
      QUARKUS_OIDC_ROLES_ROLE_CLAIM_PATH: "roles"
    secrets:
      - source: postgres_pw
        target: quarkus.datasource.password
    ports:
      - "8080:8080"


volumes:
  pg-data:
    driver: "local"
  rauthy-data:
    driver: "local"

secrets:
  postgres_pw:
    file: secrets/pg_pass