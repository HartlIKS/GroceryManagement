@let form = formInput();
<h3 class="form-row">Pagination Parameters</h3>
<div class="form-row">
  <mat-form-field appearance="outline" class="half-width">
    <mat-label>Page</mat-label>
    <input matInput type="number" [formField]="form.page" placeholder="Page number">
  </mat-form-field>
  <mat-form-field appearance="outline" class="half-width">
    <mat-label>Page Size</mat-label>
    <input matInput type="number" [formField]="form.pageSize" placeholder="Items per page">
  </mat-form-field>
</div>
<div class="form-row">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Item Count</mat-label>
    <input matInput type="number" [formField]="form.itemCount" placeholder="Total items">
  </mat-form-field>
</div>
